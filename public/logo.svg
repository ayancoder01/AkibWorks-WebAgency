<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4f46e5" />
      <stop offset="100%" stopColor="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Background frame -->
  <rect x="5" y="5" width="50" height="50" rx="8" fill="none" stroke="url(#logoGradient)" stroke-width="1" opacity="0.3" />

  <!-- Letter A -->
  <line x1="15" y1="45" x2="22" y2="15" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="29" y1="45" x2="22" y2="15" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="18" y1="32" x2="26" y2="32" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round" />

  <!-- Letter W -->
  <line x1="32" y1="15" x2="36" y2="45" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="40" y1="25" x2="42" y2="45" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="44" y1="25" x2="46" y2="45" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="48" y1="15" x2="50" y2="45" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bottom accent -->
  <line x1="8" y1="50" x2="52" y2="50" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.4" stroke-linecap="round" />
</svg>